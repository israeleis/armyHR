<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232b1a"/>
      <stop offset="100%" stop-color="#131510"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#c3cc8c" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Military HUD corner brackets -->
  <g stroke="#c3cc8c" stroke-width="14" stroke-linecap="square" fill="none" opacity="0.28">
    <polyline points="68,116 68,68 116,68"/>
    <polyline points="396,68 444,68 444,116"/>
    <polyline points="68,396 68,444 116,444"/>
    <polyline points="444,396 444,444 396,444"/>
  </g>

  <!-- מ glyph -->
  <text x="256" y="370"
    font-family="Arial Hebrew, Arial, Helvetica, sans-serif"
    font-size="340"
    font-weight="bold"
    fill="#c3cc8c"
    text-anchor="middle"
    filter="url(#glow)">מ</text>
</svg>
